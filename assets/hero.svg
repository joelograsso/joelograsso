<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joe LoGrasso — GitHub projects and expertise</title>
  <desc id="desc">A GitHub-focused project banner highlighting open source, technical depth, and building across the stack.</desc>
  <defs>
    <linearGradient id="background" x1="34" y1="18" x2="1164" y2="402" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#0C1F3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="66" y1="0" x2="710" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="skyGlow">
      <stop stop-color="#0EA5E9" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#8B5CF6" stop-opacity="0.21"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="8" y="8" width="1184" height="404" rx="28"/>
    </clipPath>
    <style>
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .pulse-b { animation-delay: -1.2s; }
      .pulse-c { animation-delay: -2.4s; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: .8; } }
    </style>
  </defs>

