      <rect x="884" y="218" width="76" height="30" rx="15" fill="#20172E" stroke="#A78BFA" stroke-opacity="0.65"/>
      <text x="922" y="238" fill="#DDD6FE" font-size="13">AI</text>
    </g>
    <g>
