<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Joe LoGrasso</title>
  <desc id="desc">Software engineer, product builder, and curious human. Ship end to end.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="24" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="signal" x1="130" y1="110" x2="770" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#84CC16"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#38BDF8" stroke-opacity="0.075"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#bg)" stroke="#26364D" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#grid)"/>
  <circle cx="1028" cy="180" r="166" fill="#0EA5E9" fill-opacity="0.035"/>
  <circle cx="1028" cy="180" r="118" stroke="#22D3EE" stroke-opacity="0.15" stroke-dasharray="6 10"/>
  <circle cx="1028" cy="180" r="77" stroke="#84CC16" stroke-opacity="0.18"/>
  <path d="M875 61C978 108 1069 73 1167 125" stroke="#F97316" stroke-opacity="0.16" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="58" y="48" width="176" height="34" rx="17" fill="#101D2E" stroke="#26364D"/>
    <circle cx="78" cy="65" r="5" fill="#84CC16" filter="url(#glow)"/>
    <text x="92" y="71" fill="#9FB3C8" font-size="14" letter-spacing="1.5">JOE.OS / ONLINE</text>

    <text x="58" y="152" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">JOE LOGRASSO</text>
    <rect x="58" y="173" width="640" height="5" rx="2.5" fill="url(#signal)"/>
    <text x="58" y="218" fill="#B8C8D9" font-size="18" letter-spacing="3">SOFTWARE ENGINEER • PRODUCT BUILDER</text>
    <text x="58" y="252" fill="#7890A8" font-size="15" letter-spacing="2">MOBILE / AI / FULL STACK / CREATIVE CODE</text>

    <text x="58" y="318" fill="#22D3EE" font-size="14">SLC</text>
    <text x="101" y="318" fill="#526A82" font-size="14">//</text>
    <text x="130" y="318" fill="#84CC16" font-size="14">SHIP END TO END</text>
    <text x="270" y="318" fill="#526A82" font-size="14">//</text>
    <text x="299" y="318" fill="#F97316" font-size="14">BUILDING IN PUBLIC SINCE 2019</text>
  </g>

