      <rect x="979" y="73" width="98" height="30" rx="15" fill="#102536" stroke="#22D3EE" stroke-opacity="0.65"/>
      <text x="1028" y="93" fill="#A5F3FC" font-size="13">PRODUCT</text>
    </g>
    <g>
